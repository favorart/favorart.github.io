<text x="700.0" y="165.9" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" fill="#004f90" xml:space="preserve">template &lt;typename T&gt;</text>
<text x="700.0" y="211.8" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" fill="#5d6470" xml:space="preserve">class Pool {</text>
<text x="700.0" y="257.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" fill="#5d6470" xml:space="preserve">  alignas(64) T* data_;</text>
<text x="700.0" y="303.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" fill="#5d6470" xml:space="preserve">  size_t size_;</text>
<text x="700.0" y="349.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" fill="#5d6470" xml:space="preserve">public:</text>
<text x="700.0" y="395.3" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" fill="#004f90" xml:space="preserve">  T&amp; operator[](size_t i)</text>
<text x="700.0" y="441.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" fill="#5d6470" xml:space="preserve">    noexcept { return data_[i]; }</text>
<text x="700.0" y="487.1" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" fill="#5d6470" xml:space="preserve">};</text>

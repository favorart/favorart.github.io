<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#111418"/>
<g opacity=".75"><text x="300.0" y="127.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="35" fill="#6aaef0" xml:space="preserve">template &lt;typename T&gt;</text>
<text x="300.0" y="185.3" font-family="'JetBrains Mono', Consolas, monospace" font-size="35" fill="#9aa3ae" xml:space="preserve">class Pool {</text>
<text x="300.0" y="242.9" font-family="'JetBrains Mono', Consolas, monospace" font-size="35" fill="#9aa3ae" xml:space="preserve">  alignas(64) T* data_;</text>
<text x="300.0" y="300.6" font-family="'JetBrains Mono', Consolas, monospace" font-size="35" fill="#9aa3ae" xml:space="preserve">  size_t size_;</text>
<text x="300.0" y="358.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="35" fill="#9aa3ae" xml:space="preserve">public:</text>
<text x="300.0" y="415.9" font-family="'JetBrains Mono', Consolas, monospace" font-size="35" fill="#6aaef0" xml:space="preserve">  T&amp; operator[](size_t i)</text>
<text x="300.0" y="473.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="35" fill="#9aa3ae" xml:space="preserve">    noexcept { return data_[i]; }</text>
<text x="300.0" y="531.2" font-family="'JetBrains Mono', Consolas, monospace" font-size="35" fill="#9aa3ae" xml:space="preserve">};</text></g>

<div class="reader glass">
$hero
<header class="article-head">
  <div class="kicker">$type_chip $kind<span class="k-date"><span class="sep"> · </span>$date$views</span></div>
  <h1 lang="$title_lang">$title</h1>
  $subtitle
  <div class="byline">$author$source_top$demo</div>
</header>
<article class="prose" lang="$lang">
$content
</article>
<div class="article-foot">
<div class="foot-actions">
  <a class="btn big calm" href="$back_href"><span class="arr back">←</span> $back_text</a>
  $cta
</div>
</div>
</div>

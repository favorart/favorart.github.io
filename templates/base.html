<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* theme before first paint: saved choice (light|dark) or the OS setting */
try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<meta name="color-scheme" content="light dark">
<title>$title</title>
<meta name="description" content="$description">
<meta property="og:title" content="$og_title">
<meta property="og:description" content="$description">
<meta property="og:type" content="$og_type">
<meta property="og:url" content="$url">
<meta property="og:locale" content="$og_locale">
$head_extra
<link rel="canonical" href="$canonical">
<link rel="icon" href="$favicon_url" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="$css_url">
</head>
<body class="$body_class" data-section="$section" id="top">
<div class="bg" aria-hidden="true"></div>

<header class="top">
  <div class="bar">
    <a class="who" href="$prefix/"><img class="logo" src="$favicon_url" alt="" width="40" height="40"><span><b>$author</b><small>$role_title</small><small class="sub">$role_skills</small></span></a>
    <nav class="lang" aria-label="$aria_language">
      $lang_nav
    </nav>
    <button class="theme" type="button" data-mode="auto" aria-label="$theme_label">
      <svg data-i="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>
      <svg data-i="light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg data-i="dark" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </div>
  <nav class="mnav" aria-label="$aria_sections">$nav_items</nav>
</header>

<div class="layout">
  <aside class="side">
    <nav class="snav glass" aria-label="$aria_sections">$nav_items</nav>
  </aside>
  <main>
$body
    <footer>
      <span><a href="$prefix/#contact">$footer_contact</a> · <a href="https://www.linkedin.com/in/golikovkirill/">LinkedIn</a> · <a href="https://github.com/favorart">GitHub</a></span>
      <p class="copy">$footer_copy</p>
    </footer>
  </main>
</div>

<script>
  // theme switch: auto (OS) -> light -> dark -> auto; the choice is kept in localStorage
  (function () {
    var btn = document.querySelector('.theme'), root = document.documentElement;
    var names = { auto: "$theme_auto", light: "$theme_light", dark: "$theme_dark" };
    function show(mode) { btn.setAttribute('data-mode', mode); btn.title = names[mode]; }
    show(root.getAttribute('data-theme') || 'auto');
    btn.addEventListener('click', function () {
      var next = { auto: 'light', light: 'dark', dark: 'auto' }[btn.getAttribute('data-mode')];
      if (next === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
      try { if (next === 'auto') localStorage.removeItem('theme'); else localStorage.setItem('theme', next); } catch (e) {}
      show(next);
    });
  })();
  // hero "Also:" roles: one at a time, fading through frosted glass (reduced motion: a short plain cross-fade, see CSS;
  // without JS all roles stay inline)
  (function () {
    var box = document.querySelector('.also .roles');
    if (!box) return;
    var roles = box.querySelectorAll('.role'), i = 0;
    box.classList.add('cycle'); roles[0].classList.add('on');
    setInterval(function () {
      roles[i].classList.remove('on'); i = (i + 1) % roles.length; roles[i].classList.add('on');
    }, 3000);
  })();
  // home page: highlight the section in view (inner pages get it from data-section)
  (function () {
    if (!document.body.classList.contains('home') || !('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) document.body.setAttribute('data-section', en.target.getAttribute('data-nav'));
      });
    }, { rootMargin: '-35% 0px -60% 0px' });
    document.querySelectorAll('[data-nav]').forEach(function (s) { io.observe(s); });
  })();
  // view counts from GoatCounter's public counter API (hidden when unavailable)
  (function () {
    var base = '$gc_counter', els = document.querySelectorAll('[data-views]');
    if (!base || !els.length || !window.fetch) return;
    var byPath = {};
    els.forEach(function (el) { (byPath[el.getAttribute('data-views')] = byPath[el.getAttribute('data-views')] || []).push(el); });
    Object.keys(byPath).forEach(function (path) {
      fetch(base + encodeURIComponent(path) + '.json').then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var n = d && d.count ? String(d.count).trim() : '';
          if (!n || n === '0') return;
          byPath[path].forEach(function (el) { el.querySelector('b').textContent = n; el.hidden = false; });
        }).catch(function () {});
    });
  })();
  // engagement events for GoatCounter (cookie-free, nothing personal: only the event name and the page path).
  // Event names: click/contact, out/<host>/<path>, download/<file>, form/contact-sent,
  // read-50|read-90|time-1m|time-3m + <page path>. Shown under "Events" on the GoatCounter dashboard.
  (function () {
    if (!'$gc_counter') return;
    var queue = [];
    function send(name, title) {
      var g = window.goatcounter;
      if (g && g.count) {
        // "read-50/" etc. get the page path exactly as count.js counted the page view (canonical + path callback)
        var page = g.get_data ? g.get_data({}).p : location.pathname;
        if (/\/$$/.test(name)) name += page.replace(/^\/+/, '');
        g.count({ path: name, title: (title || name).replace('@page', page), event: true });
        return;
      }
      // count.js loads async: keep the event until it is there
      if (queue.push([name, title]) > 1) return;
      var t = setInterval(function () {
        if (!window.goatcounter || !window.goatcounter.count) return;
        clearInterval(t); queue.splice(0).forEach(function (q) { send(q[0], q[1]); });
      }, 500);
    }
    // clicks: contact, outgoing links, files
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var u; try { u = new URL(a.href, location.href); } catch (x) { return; }
      var text = (a.textContent || '').trim().slice(0, 80);
      if (u.protocol === 'mailto:') send('click/mailto', text);
      else if (u.origin === location.origin && u.hash === '#contact') send('click/contact', text + ' @page');
      else if (/\.(pdf|zip|docx?|pptx?)$$/i.test(u.pathname)) send('download/' + u.pathname.split('/').pop(), u.href);
      else if (u.origin !== location.origin && /^https?:$$/.test(u.protocol))
        send('out/' + u.hostname.replace(/^www\./, '') + u.pathname.split('/').slice(0, 3).join('/').replace(/\/+$$/, ''), text + ' @page');
    }, true);
    // contact form: the submit event fires only after the browser's validation passed
    var form = document.getElementById('contact-form');
    if (form) form.addEventListener('submit', function () { send('form/contact-sent', 'Contact form sent @page'); });
    // reading depth and visible time, once per page view; skipped on pages that fit in about one screen
    var marks = {};
    function once(k, name) { if (!marks[k]) { marks[k] = 1; send(name + '/', name + ' @page'); } }
    function depth() {
      var h = document.documentElement.scrollHeight, v = window.innerHeight;
      if (h < v * 1.5) return;
      var d = (window.scrollY + v) / h;
      if (d >= 0.5) once('50', 'read-50');
      if (d >= 0.9) once('90', 'read-90');
    }
    window.addEventListener('scroll', depth, { passive: true });
    var seen = 0;
    setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      seen += 5;
      if (seen === 60) once('t1', 'time-1m');
      if (seen === 180) once('t3', 'time-3m');
    }, 5000);
  })();
</script>
</body>
</html>

<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* theme before first paint: saved choice (light|dark) or the OS setting */
try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<meta name="color-scheme" content="light dark">
<title>$title</title>
<meta name="description" content="$description">
<meta property="og:title" content="$og_title">
<meta property="og:description" content="$description">
<meta property="og:type" content="$og_type">
<meta property="og:url" content="$url">
$head_extra
<link rel="canonical" href="$url">
<link rel="icon" href="$favicon_url" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="$css_url">
</head>
<body class="$body_class" data-section="$section" id="top">
<div class="bg" aria-hidden="true"></div>

<header class="top">
  <div class="bar">
    <a class="who" href="$prefix/"><img class="logo" src="$favicon_url" alt="" width="40" height="40"><span><b>$author</b><small>$role_title</small><small class="sub">$role_skills</small></span></a>
    <nav class="lang" aria-label="Language">
      <a href="$prefix/" aria-current="true" lang="en">EN</a><span title="$lang_soon" lang="es">ES</span><span title="$lang_soon" lang="ru">RU</span><span title="$lang_soon" lang="sr">SR</span><span title="$lang_soon" lang="uz">UZ</span>
    </nav>
    <button class="theme" type="button" data-mode="auto" aria-label="$theme_label">
      <svg data-i="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>
      <svg data-i="light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg data-i="dark" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </div>
  <nav class="mnav" aria-label="Sections">$nav_items</nav>
</header>

<div class="layout">
  <aside class="side">
    <nav class="snav glass" aria-label="Sections">$nav_items</nav>
  </aside>
  <main>
$body
    <footer>
      <span><a href="$prefix/#contact">$footer_contact</a> · <a href="https://www.linkedin.com/in/golikovkirill/">LinkedIn</a> · <a href="https://github.com/favorart">GitHub</a></span>
      <p class="copy">$footer_copy</p>
    </footer>
  </main>
</div>

<script>
  // theme switch: auto (OS) -> light -> dark -> auto; the choice is kept in localStorage
  (function () {
    var btn = document.querySelector('.theme'), root = document.documentElement;
    var names = { auto: "$theme_auto", light: "$theme_light", dark: "$theme_dark" };
    function show(mode) { btn.setAttribute('data-mode', mode); btn.title = names[mode]; }
    show(root.getAttribute('data-theme') || 'auto');
    btn.addEventListener('click', function () {
      var next = { auto: 'light', light: 'dark', dark: 'auto' }[btn.getAttribute('data-mode')];
      if (next === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
      try { if (next === 'auto') localStorage.removeItem('theme'); else localStorage.setItem('theme', next); } catch (e) {}
      show(next);
    });
  })();
  // hero "Also:" roles: one at a time, fading through frosted glass (reduced motion: a short plain cross-fade, see CSS;
  // without JS all roles stay inline)
  (function () {
    var box = document.querySelector('.also .roles');
    if (!box) return;
    var roles = box.querySelectorAll('.role'), i = 0;
    box.classList.add('cycle'); roles[0].classList.add('on');
    setInterval(function () {
      roles[i].classList.remove('on'); i = (i + 1) % roles.length; roles[i].classList.add('on');
    }, 3000);
  })();
  // home page: highlight the section in view (inner pages get it from data-section)
  (function () {
    if (!document.body.classList.contains('home') || !('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) document.body.setAttribute('data-section', en.target.getAttribute('data-nav'));
      });
    }, { rootMargin: '-35% 0px -60% 0px' });
    document.querySelectorAll('[data-nav]').forEach(function (s) { io.observe(s); });
  })();
</script>
</body>
</html>

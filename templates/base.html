<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<meta property="og:title" content="$og_title">
<meta property="og:description" content="$description">
<meta property="og:type" content="$og_type">
<meta property="og:url" content="$url">
$head_extra
<link rel="canonical" href="$url">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd3e1'/%3E%3Cstop offset='.5' stop-color='%23e6dcff'/%3E%3Cstop offset='1' stop-color='%23cfe0ff'/%3E%3C/linearGradient%3E%3CradialGradient id='s'%3E%3Cstop offset='0' stop-color='%23ffc95e'/%3E%3Cstop offset='.45' stop-color='%23ffd98c' stop-opacity='.8'/%3E%3Cstop offset='1' stop-color='%23ffe2a6' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='47' cy='17' r='17' fill='url(%23s)'/%3E%3Ccircle cx='47' cy='17' r='5.5' fill='%23f7a823'/%3E%3Ctext x='28' y='45' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='23' fill='%23352c4a' text-anchor='middle'%3EKG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body class="$body_class" data-section="$section" id="top">
<div class="bg" aria-hidden="true"><i class="sun"></i></div>

<header class="top">
  <div class="bar">
    <a class="who" href="$prefix/"><span class="avatar">KG</span><span><b>$author</b><small>$tagline</small></span></a>
    <nav class="lang" aria-label="Language">
      <a href="$prefix/" aria-current="true" lang="en">EN</a><span title="$lang_soon" lang="es">ES</span><span title="$lang_soon" lang="ru">RU</span><span title="$lang_soon" lang="sr">SR</span><span title="$lang_soon" lang="uz">UZ</span>
    </nav>
  </div>
  <nav class="mnav" aria-label="Sections">$nav_items</nav>
</header>

<div class="layout">
  <aside class="side">
    <nav class="snav glass" aria-label="Sections">$nav_items</nav>
  </aside>
  <main>
$body
    <footer>
      <span><a href="$prefix/#contact">$footer_contact</a> · <a href="https://www.linkedin.com/in/golikovkirill/">LinkedIn</a> · <a href="https://github.com/favorart">GitHub</a></span>
      <p class="copy">$footer_copy</p>
    </footer>
  </main>
</div>

<script>
  // home page: highlight the section in view (inner pages get it from data-section)
  (function () {
    if (!document.body.classList.contains('home') || !('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) document.body.setAttribute('data-section', en.target.getAttribute('data-nav'));
      });
    }, { rootMargin: '-35% 0px -60% 0px' });
    document.querySelectorAll('[data-nav]').forEach(function (s) { io.observe(s); });
  })();
</script>
</body>
</html>

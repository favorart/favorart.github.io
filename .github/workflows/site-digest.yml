name: Weekly "what's new" digest

# Every Sunday: what changed on the site's Russian pages over the week (new pages, edited paragraphs
# "было -> стало", removed ones), e-mailed through Web3Forms to the contact form's inbox, ready to forward.
# Last week's text is the snapshot artifact of the previous scheduled run; without one (first run, or a manual
# run) the site is built from the commit N days ago. Note: a build of an old commit reads the external
# article repos as they are now, so their changes show only when last week's snapshot exists.
# Secret: CONTACT_FORM_KEY (the contact form's Web3Forms key, already used by pages.yml).

on:
  schedule:
    # Sunday 9:00 in Spain: 08:00 UTC in winter, 07:00 UTC in summer (cron is UTC only), so both run.
    # GitHub may start a scheduled run hours late (on 2026-11-22 both started after 15:00), so the "when"
    # job does not wait for exactly 9 o'clock: the first run at or after 9:00 Madrid sends, and any later
    # one sees this week's snapshot artifact and stays quiet.
    - cron: "0 7 * * 0"
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      end:
        description: "Last day of the period, YYYY-MM-DD (empty: today)"
        default: ""
      days:
        description: "Length of the period in days"
        default: "7"
      send:
        description: "E-mail it (otherwise only print it in the log)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # to download the previous run's snapshot

concurrency:   # the two crons, when both are late, run one after the other: the second sees the first's artifact
  group: site-digest
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.clock.outputs.go }}
    steps:
      - id: clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Madrid time: $(TZ=Europe/Madrid date '+%F %a %H:%M')"
          if [ "${{ github.event_name }}" != schedule ]; then echo go=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=Europe/Madrid date +%u)" = 7 ] && [ "$(TZ=Europe/Madrid date +%-H)" -lt 9 ]; then
            echo "before 9:00 in Madrid: the other cron sends"; exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=site-digest-snapshot&per_page=1" -q '.artifacts[0].created_at // ""')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt $((5 * 86400)) ]; then
            echo "already sent this week ($last)"; exit 0
          fi
          echo go=true >> "$GITHUB_OUTPUT"

  digest:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DAYS: ${{ inputs.days || '7' }}
      END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: This week's site
        run: |
          if [ -z "$END" ]; then
            python build.py --out "$RUNNER_TEMP/new_site"
          else   # a past week: the site as it was at the end of that day (Spain)
            head=$(git rev-list -1 --first-parent --before="$END 23:59:59 +0100" HEAD)
            echo "building the site at $head (end of $END)"
            git worktree add -q "$RUNNER_TEMP/head" "$head"
            (cd "$RUNNER_TEMP/head" && python build.py --out "$RUNNER_TEMP/new_site")
          fi
          python tools/site_digest.py snapshot "$RUNNER_TEMP/new_site" "$RUNNER_TEMP/new.json"

      - name: Last week's site
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          if [ -z "$END" ]; then
            # the latest run that sent a digest kept its snapshot (runs that only print it keep none)
            for id in $(gh run list --workflow site-digest.yml --status success -L 10 --json databaseId -q '.[].databaseId'); do
              if gh run download "$id" -n site-digest-snapshot -D "$RUNNER_TEMP/prev" 2>/dev/null; then
                cp "$RUNNER_TEMP/prev/new.json" "$RUNNER_TEMP/old.json"
                echo "previous snapshot: run $id"
                exit 0
              fi
            done
          fi
          end=${END:-$(date -u +%F)}
          start=$(date -u -d "$end - $DAYS days" +%F)
          base=$(git rev-list -1 --first-parent --before="$start 23:59:59 +0100" HEAD)
          if [ -z "$base" ]; then echo "no site before $start"; echo '{}' > "$RUNNER_TEMP/old.json"; exit 0; fi
          echo "building the site at $base (end of $start)"
          git worktree add -q "$RUNNER_TEMP/old" "$base"
          (cd "$RUNNER_TEMP/old" && python build.py --out "$RUNNER_TEMP/old_site")
          python tools/site_digest.py snapshot "$RUNNER_TEMP/old_site" "$RUNNER_TEMP/old.json"

      - name: Digest
        env:
          CONTACT_FORM_KEY: ${{ secrets.CONTACT_FORM_KEY }}
        run: |
          send=""
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.send }}" = true ]; then send=--send; fi
          python tools/site_digest.py diff "$RUNNER_TEMP/old.json" "$RUNNER_TEMP/new.json" --days "$DAYS" \
            ${END:+--end "$END"} $send

      - name: Keep this week's text for next Sunday   # also marks the week as sent (see "when")
        if: github.event_name == 'schedule' || (inputs.send && inputs.end == '')
        uses: actions/upload-artifact@v4
        with:
          name: site-digest-snapshot
          path: ${{ runner.temp }}/new.json
          retention-days: 30

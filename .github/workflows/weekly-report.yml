name: Weekly analytics report

# Every Monday: GoatCounter stats for the past week, e-mailed through Web3Forms to the same inbox as the
# contact form. The report is not printed or published: this repo and its Actions logs are public.
# Secrets: GOATCOUNTER_API_TOKEN (GoatCounter -> your name -> API -> "Read statistics" for this site)
# and CONTACT_FORM_KEY (the contact form's Web3Forms key, already used by pages.yml).

on:
  schedule:
    - cron: "0 7 * * 1"   # Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/weekly_report.py --send
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
          CONTACT_FORM_KEY: ${{ secrets.CONTACT_FORM_KEY }}

name: Weekly analytics report

# Every Monday: GoatCounter stats for the past week -> a new issue labelled "analytics" (GitHub e-mails it to
# the repo owner); the previous report issue is closed. Needs the repo secret GOATCOUNTER_API_TOKEN
# (GoatCounter -> your name in the top menu -> API -> a key that can read statistics).

on:
  schedule:
    - cron: "0 7 * * 1"   # Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the report
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python tools/weekly_report.py > report.md
      - name: Publish as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create analytics --color 0E8A16 --description "Weekly GoatCounter report" --force
          for n in $(gh issue list --label analytics --state open --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed
          done
          gh issue create --label analytics --body-file report.md \
            --title "Аналитика сайта: неделя до $(date -u +%d.%m.%Y)"

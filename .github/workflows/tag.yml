name: Tag

# Every push to main gets the next patch tag: v0.0.1, v0.0.2, ... (no releases in this repo).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: tag
      run: |
        if git tag --points-at HEAD | grep -q '^v[0-9]'; then exit 0; fi
        last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
        IFS=. read -r major minor patch <<< "${last#v}"
        tag="v$major.$minor.$((patch + 1))"
        git tag "$tag" && git push origin "$tag"
        echo "new_tag=$tag" >> "$GITHUB_OUTPUT"

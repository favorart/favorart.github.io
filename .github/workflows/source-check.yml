name: Check publication sources

# Every week: are the publishers' PDFs of the papers still online? The result goes to papers/source-status.yml;
# after several failed weeks in a row build.py switches the links to the saved text (papers/<slug>.md).
# A commit made with GITHUB_TOKEN does not start other workflows, so the site is rebuilt explicitly.

on:
  schedule:
    - cron: "40 5 * * 1"   # Monday 05:40 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/check_sources.py
      - name: Commit the new state and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- papers/source-status.yml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/source-status.yml
          git commit -m "Publication sources: weekly check"
          git push
          gh workflow run pages.yml --ref main
